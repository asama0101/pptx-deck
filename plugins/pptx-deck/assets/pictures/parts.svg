<!-- 絵（pp-picture）の部品。必要な <symbol> を、スライドの <svg> の <defs> に写して、<use href="#i-xxx" x y width height/> で置く。
     色は sv-f-*（塗り）・sv-s-*（線）のクラスだけ（テーマの変数。リテラルの色は check が警告する）。アイコンは 64×64 の座標。
     種類: i-user 利用者 / i-pc 端末 / i-server サーバ / i-db DB（円柱）/ i-router ルーター / i-switch スイッチ / i-fw FW / i-lb LB
           / i-cloud クラウド / i-internet インターネット / i-alert 障害点 / i-doc 文書。
     矢じりは m-acc（基調色）・m-emph（強調色・1 枚 1 点）。線は stroke-width 3〜4、破線は stroke-dasharray="10 6"。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute">
  <defs>
    <marker id="m-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="sv-f-accent"/>
    </marker>
    <marker id="m-emph" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="sv-f-emph"/>
    </marker>

    <symbol id="i-user" viewBox="0 0 64 64">
      <circle cx="32" cy="20" r="11" class="sv-f-mid"/>
      <path d="M10 58 Q10 34 32 34 Q54 34 54 58 Z" class="sv-f-accent"/>
    </symbol>
    <symbol id="i-pc" viewBox="0 0 64 64">
      <rect x="6" y="8" width="52" height="34" rx="3" class="sv-f-dark"/>
      <rect x="10" y="12" width="44" height="26" class="sv-f-white"/>
      <rect x="27" y="42" width="10" height="8" class="sv-f-mid"/>
      <rect x="16" y="50" width="32" height="6" rx="2" class="sv-f-mid"/>
    </symbol>
    <symbol id="i-server" viewBox="0 0 64 64">
      <rect x="10" y="6" width="44" height="16" rx="2" class="sv-f-accent"/>
      <rect x="10" y="24" width="44" height="16" rx="2" class="sv-f-accent"/>
      <rect x="10" y="42" width="44" height="16" rx="2" class="sv-f-accent"/>
      <circle cx="18" cy="14" r="2.5" class="sv-f-white"/><circle cx="18" cy="32" r="2.5" class="sv-f-white"/><circle cx="18" cy="50" r="2.5" class="sv-f-white"/>
      <rect x="30" y="12" width="18" height="4" class="sv-f-white"/><rect x="30" y="30" width="18" height="4" class="sv-f-white"/><rect x="30" y="48" width="18" height="4" class="sv-f-white"/>
    </symbol>
    <symbol id="i-db" viewBox="0 0 64 64">
      <path d="M12 14 V50 A20 8 0 0 0 52 50 V14 Z" class="sv-f-accent"/>
      <ellipse cx="32" cy="14" rx="20" ry="8" class="sv-f-light"/>
      <path d="M12 28 A20 8 0 0 0 52 28" class="sv-f-none sv-s-white" stroke-width="2.5"/>
      <path d="M12 40 A20 8 0 0 0 52 40" class="sv-f-none sv-s-white" stroke-width="2.5"/>
    </symbol>
    <symbol id="i-router" viewBox="0 0 64 64">
      <rect x="6" y="32" width="52" height="20" rx="4" class="sv-f-accent"/>
      <path d="M18 32 V12 M46 32 V12" class="sv-f-none sv-s-accent" stroke-width="4" stroke-linecap="round"/>
      <circle cx="18" cy="10" r="4" class="sv-f-mid"/><circle cx="46" cy="10" r="4" class="sv-f-mid"/>
      <circle cx="16" cy="42" r="3" class="sv-f-white"/><circle cx="28" cy="42" r="3" class="sv-f-white"/><circle cx="40" cy="42" r="3" class="sv-f-white"/>
    </symbol>
    <symbol id="i-switch" viewBox="0 0 64 64">
      <rect x="4" y="22" width="56" height="24" rx="3" class="sv-f-accent"/>
      <rect x="10" y="30" width="8" height="8" class="sv-f-white"/><rect x="21" y="30" width="8" height="8" class="sv-f-white"/>
      <rect x="32" y="30" width="8" height="8" class="sv-f-white"/><rect x="43" y="30" width="8" height="8" class="sv-f-white"/>
    </symbol>
    <symbol id="i-fw" viewBox="0 0 64 64">
      <rect x="6" y="10" width="52" height="44" rx="2" class="sv-f-accent"/>
      <path d="M6 24.7 H58 M6 39.3 H58 M22 10 V24.7 M42 10 V24.7 M32 24.7 V39.3 M14 24.7 V39.3 M50 24.7 V39.3 M22 39.3 V54 M42 39.3 V54" class="sv-f-none sv-s-white" stroke-width="2.5"/>
    </symbol>
    <symbol id="i-lb" viewBox="0 0 64 64">
      <circle cx="10" cy="32" r="6" class="sv-f-dark"/>
      <path d="M16 32 L46 12 M16 32 L46 32 M16 32 L46 52" class="sv-f-none sv-s-accent" stroke-width="3.5"/>
      <circle cx="52" cy="12" r="6" class="sv-f-accent"/><circle cx="52" cy="32" r="6" class="sv-f-accent"/><circle cx="52" cy="52" r="6" class="sv-f-accent"/>
    </symbol>
    <symbol id="i-cloud" viewBox="0 0 64 64">
      <path d="M17 48 A12 12 0 0 1 18 24 A16 16 0 0 1 48 26 A11 11 0 0 1 47 48 Z" class="sv-f-light sv-s-accent" stroke-width="3" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-internet" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="25" class="sv-f-light sv-s-accent" stroke-width="3"/>
      <ellipse cx="32" cy="32" rx="11" ry="25" class="sv-f-none sv-s-accent" stroke-width="2.5"/>
      <path d="M7 32 H57 M12 18 H52 M12 46 H52" class="sv-f-none sv-s-accent" stroke-width="2.5"/>
    </symbol>
    <symbol id="i-alert" viewBox="0 0 64 64">
      <path d="M32 6 L60 56 H4 Z" class="sv-f-emph" stroke-linejoin="round"/>
      <rect x="29" y="22" width="6" height="18" rx="2" class="sv-f-white"/><circle cx="32" cy="47" r="3.5" class="sv-f-white"/>
    </symbol>
    <symbol id="i-doc" viewBox="0 0 64 64">
      <path d="M14 6 H40 L52 18 V58 H14 Z" class="sv-f-white sv-s-accent" stroke-width="3" stroke-linejoin="round"/>
      <path d="M40 6 V18 H52" class="sv-f-none sv-s-accent" stroke-width="3"/>
      <path d="M22 30 H44 M22 38 H44 M22 46 H36" class="sv-f-none sv-s-accent" stroke-width="3"/>
    </symbol>
  </defs>
</svg>
