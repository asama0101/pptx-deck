<!-- 用途: 領域。複数の担当や要素が、どの工程・範囲を受け持つかを帯・マス・矢印で示し、説明したい範囲（今回の対象）を強調色で囲む。工程の見出しを左から右へ並べ、行ごとに担当を置く。時間の予定は gantt を使う。
     デザイン1との違い: 面を使わず、工程の列の境に縦線を引き、担当を矢印の線で示す。強調する範囲は強調色の破線で囲む。
     濃淡の付け方: ベンダー（今回の契約相手）の矢印だけ基調色、ほかは中間色。矢印は表の右端（x=1212）の手前で止める。強調色は委託範囲の破線と名前の 1 点。
