<!-- 用途: 画面・写真・既存の図に、番号付きの注釈（丸・矢印・枠）を重ねて説明する。右に番号の凡例を置く。土台は絵の中の <image> でも、SVG で描いた画面でもよい。
     土台に利用者の画像を使うとき: 画像を <元データ>/material/ に置き、下の「画面の絵」の代わりに <image href="material/xxx.png" x="8" y="8" width="720" height="350" preserveAspectRatio="xMidYMid meet"/> を置く。画像の中身は PowerPoint で直せない。
     機密: 画像の文字・IP アドレス・機器名は、そのまま PPTX に埋め込まれる。伏せる所は、画像の上に sv-f-dark の四角を重ねて隠す（元の画像は渡さない）。
     絵（pp-picture）は 1 枚の画像として PPTX に貼られ、PowerPoint では直せない。題・ヘッドメッセージ・チャートタイトル・注釈は編集できる文字。直すときは Claude に頼んで描き直す。
     差し替える所: 土台・注釈の丸と矢印と枠・凡例の文言（1 行 18 字まで）・強調（最重要の 1 つ。1 枚 1 点）・data-alt・注釈。
     守ること: 絵の中の色は sv-f-*・sv-s-* のクラスだけ。文字は 20px（15pt）以上。丸の番号は凡例と同じ順に付ける。 -->
